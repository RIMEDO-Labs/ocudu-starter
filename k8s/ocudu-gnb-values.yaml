# OCUDU gNB (CU/DU combined) in test mode: ru_dummy radio + test_ue, no hardware.
# Used with the ocudu-gnb chart from ocudu_helm (charts/ocudu-gnb, main branch).

image:
  # AVX2 build: this CPU has no AVX-512. Pick avx512/neon to match other hosts.
  repository: registry.gitlab.com/ocudu/ocudu/images/gnb-dpdk
  tag: "ubuntu-24.04-avx2-20261007_2e9f5671"

network:
  hostNetwork: false

# No real fronthaul NIC: ru_dummy needs neither SR-IOV nor DPDK.
sriovConfig:
  enabled: false

# ClusterIP Service gnb-ocudu-gnb-metrics:8001 for Telegraf (remote_control WebSocket).
metricsService:
  enabled: true

# Logs go to an emptyDir; read them with kubectl logs / kubectl cp.
persistence:
  enabled: false

# The CPU limit is a CFS quota: with too little headroom the real-time PHY/MAC threads get
# throttled and the cell misses slots ("DL task queue is full", zero throughput).
resources:
  requests:
    cpu: 4
    memory: 3Gi
  limits:
    cpu: 6
    memory: 4Gi

config:
  gnb-config.yml: |-
    cu_cp:
      amf:
        # Headless Service in front of the Open5GS AMF (see amf-ngap-headless.yaml).
        addr: amf-ngap.open5gs.svc.cluster.local
        port: 38412
        supported_tracking_areas:
          - tac: 1
            plmn_list:
              - plmn: "99970"
                tai_slice_support_list:
                  - sst: 1
                    sd: 1118481   # 0x111111, as configured in Open5GS

    ru_dummy: {}

    cell_cfg:
      dl_arfcn: 632628
      band: 78
      channel_bandwidth_MHz: 20
      common_scs: 30
      plmn: "99970"
      tac: 1
      pci: 1

    test_mode:
      test_ue:
        rnti: 0x44
        ri: 1
        cqi: 15
        nof_ues: 1
        pusch_active: true
        pdsch_active: true

    log:
      filename: /var/log/ocudu/gnb.log
      all_level: warning

    metrics:
      autostart_stdout_metrics: true
      enable_json: true

    # WebSocket endpoint that Telegraf (grafana-ocudu chart) subscribes to.
    remote_control:
      enabled: true
      bind_addr: 0.0.0.0
      port: 8001
